[project]
name = "sentinel-platform"
version = "0.1.0"
description = "Sentinel — context-aware autonomous observability platform (backend planes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0.2,<7",
]

# Planes pull heavier stacks as they land. Keeping them as extras means the
# scoring and CI images install only what they actually run.
[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.32",
]
storage = [
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.2,<4",
]
ingest = [
    "aiokafka[zstd]>=0.12,<1",
    "httpx>=0.28.1",
]
context = [
    "httpx>=0.28.1",
]
detection = [
    "drain3==0.9.11",
    "ruptures==1.1.10",
]
ml = [
    "lightgbm>=4.5,<5",
    "numpy>=2.1,<3",
    "river>=0.21,<0.23",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<0.15",
    "torch>=2.4,<3",
]

[dependency-groups]
dev = [
    "dvc==3.67.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "types-pyyaml>=6.0.12.20250516",
]

# Pin torch to the CPU wheels: this shared box has no CUDA budget for a DL
# autoencoder, and the eval must be CPU-deterministic. The CPU wheel is ~190 MB
# versus ~2.5 GB for the default CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "action",
    "api",
    "audit",
    "common",
    "context",
    "contracts",
    "decision",
    "detection",
    "ingest",
    "ml",
    "rca",
]

# --- lint / format ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# --- types ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["."]
exclude = "^\\.venv/"

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["drain3", "drain3.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["ruptures", "ruptures.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["statsmodels", "statsmodels.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "joblib", "joblib.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["river", "river.*"]
follow_untyped_imports = true

# --- tests ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a running stack (docker compose or the testbed)",
    "lab: needs the k3s testbed",
]
filterwarnings = [
    # joblib 1.5.3 still sets ndarray.shape when unpickling, which numpy 2.5
    # deprecates; it is a third-party issue on the isolation-forest load path only.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]
