[project]
name = "sentinel-platform"
version = "0.1.0"
description = "Sentinel — context-aware autonomous observability platform (backend planes)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

# Planes pull heavier stacks as they land. Keeping them as extras means the
# scoring and CI images install only what they actually run.
[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "action",
    "api",
    "audit",
    "common",
    "context",
    "contracts",
    "decision",
    "detection",
    "ingest",
    "ml",
    "rca",
]

# --- lint / format ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# --- types ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["."]
exclude = "^\\.venv/"

# --- tests ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a running stack (docker compose or the testbed)",
    "lab: needs the k3s testbed",
]
