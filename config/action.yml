# The action plane: how the platform is allowed to carry out what it decided.
#
# The policy gate (config/policies/action-policy.yml) says WHAT should happen to
# an incident. This file says how the machinery that carries it out behaves -
# whether it touches anything at all, how long one actor may hold a target, and
# which adapters are permitted to run.
#
# Everything here fails closed. An actuator that is not listed is disabled; a
# lease that cannot be taken stops the action rather than queuing it; and
# `dry_run` may be forced ON by the environment but can never be forced OFF.
version: 1

execution:
  # Ship safe. Nothing this platform decides touches a real cluster until an
  # operator deliberately sets this to false for a deployment that wants live
  # remediation. In dry-run every apply and revert is routed to the actuator's
  # own simulation and recorded as SIMULATED, so a dry-run run produces a full,
  # honest audit trail of what WOULD have happened.
  #
  # SENTINEL_ACTION_FORCE_DRY_RUN=1 in the environment overrides this to true.
  # The override is deliberately one-way: an env var that could switch a system
  # from pretending to acting is a footgun, and the file is the reviewed
  # artifact.
  dry_run: true

  # How long one actor may hold a target before the lease is considered stale
  # and reclaimable. This exists so a crashed executor cannot block remediation
  # of a service forever - and it must comfortably exceed the slowest actuator
  # call, because two actors overlapping on one target is exactly what the lease
  # prevents. 120s covers a Kubernetes rollout undo with room to spare.
  lease_ttl_seconds: 120.0

  # How many distinct effects the in-process journal remembers. The journal is
  # what makes an apply idempotent, so an effect that is still IN FORCE is never
  # evicted, whatever the capacity says; only released keys (reverted or failed)
  # are dropped, oldest first. Filling this with in-force effects means thousands
  # of un-reverted actions are outstanding, which is a runaway rather than a
  # capacity problem, so it stops instead of forgetting.
  journal_capacity: 4096

# Which adapters may run. An actuator missing from this list is refused, so
# landing an adapter and enabling it are two separate, reviewable steps.
# The mesh and feature-flag adapters are enabled as they land.
actuators:
  - actuator: SIMULATED
    enabled: true
  - actuator: KUBERNETES
    enabled: true
  - actuator: MESH
    enabled: true
  - actuator: FEATURE_FLAG
    enabled: true

# The cluster the Kubernetes actuator may reach, and the only workloads it may
# aim at. Enabling that adapter without this section is refused: an adapter with
# no stated target is not permitted.
kubernetes:
  context: k3d-sentinel-lab
  namespace: otel-demo

  # Label the demo mesh puts on every pod, used to find the nodes a workload
  # runs on before cordoning them.
  component_label: app.kubernetes.io/component

  # A hard ceiling on any scale, so a bad replica count is refused at plan time
  # rather than absorbed by the cluster. The testbed runs one replica each.
  maximum_replicas: 6

  # Topology service -> the workload an action against it actually targets.
  # This is deliberately NOT the reverse of deployments.yml's `workload_mappings`:
  # that mapping is many-to-one (`frontend` and `frontend-proxy` both report as
  # the `frontend` service), so reversing it would mean guessing which of the two
  # to scale. Only an operator can say. A service missing here is refused.
  #
  # Measured against the running testbed on 2026-07-25: the OTel demo chart names
  # its deployments plainly, so workload and service names coincide except where
  # noted above.
  workloads:
    frontend: frontend
    checkout: checkout
    cart: cart
    payment: payment
    email: email

# The edge proxy the mesh actuator restrains a cohort at. Enabling that adapter
# without this section is refused, for the same reason the Kubernetes one is: an
# adapter with no stated target is not permitted.
#
# The proxy's own configuration is lab/testbed/envoy.tmpl.yaml, which publishes
# the runtime keys named here and ships every one of them at zero. Note what is
# NOT here: the rate itself. How much a cohort is allowed is a standing decision
# about the service and lives in the proxy configuration an operator reviews;
# this plane decides only whether, and how hard, that limit applies. A system
# that could also pick the number could rate-limit a cohort to nothing by
# getting one field wrong.
mesh:
  context: k3d-sentinel-lab
  namespace: otel-demo

  # The deployment whose pod carries the Envoy admin interface, and the label
  # the demo puts on it. The admin port is reached through the API server's
  # pod-proxy subresource, so it is never published anywhere.
  workload: frontend-proxy
  component_label: app.kubernetes.io/component
  admin_port: 10000

  # Two prefixes because refusing a cohort and slowing one are two mechanisms
  # at the edge, not two settings of one. They may not be equal.
  ratelimit_key_prefix: sentinel.ratelimit
  throttle_key_prefix: sentinel.throttle

  # A cohort in config/cohorts.yml -> the runtime-key segment the proxy
  # publishes for it. Written down rather than derived, because a cohort is a
  # statement about users and a runtime key is a fact about the proxy's
  # committed configuration; an unmapped cohort is refused, never guessed.
  cohorts:
    checkout-users: checkout_users
    general-traffic: general_traffic

# The feature flags the platform may put back to safe. This is the rung that
# answers a SELF-INFLICTED incident: when the evidence is a flag flip, the remedy
# is to undo the change, not to scale the victim.
#
# The safety design is the shape of this table. Every flag here is a fault
# INJECTOR in the testbed - `paymentFailure: on` is how the cascade scenario
# breaks payment - so each entry commits the single variant the platform may
# ever write, and it is always the safe one. An actuator that could set any
# variant could cause the incident it was dispatched to fix.
#
# The service is stated the same way `deployments.yml` states it for the change
# feed, and for the same reason: the flag that affects a service is an operator's
# statement, and a decision may only flip a flag that affects the service its
# evidence named. Note the mapping cannot be reversed automatically - payment has
# two flags - which is why the ladder names the flag and this table checks it.
flags:
  context: k3d-sentinel-lab
  namespace: otel-demo

  # The demo's flagd reads its document from an emptyDir an init container copies
  # this ConfigMap into at pod start, so patching it changes nothing until flagd
  # is rolled. That is why FLAG_FLIP claims a blast fraction of 1.0.
  config_map: flagd-config
  document_key: demo.flagd.json
  workload: flagd
  component_label: app.kubernetes.io/component

  # flagd's OFREP port, reached through the API server's pod-proxy so nothing is
  # published. Verification asks the provider what variant it is actually
  # serving; a ConfigMap that says `off` only proves we wrote a file.
  ofrep_port: 8016
  rollout_timeout_seconds: 120

  remediations:
    paymentFailure:
      service: payment
      variant: "off"
    paymentUnreachable:
      service: payment
      variant: "off"
    cartFailure:
      service: cart
      variant: "off"
    emailMemoryLeak:
      service: email
      variant: "off"
    kafkaQueueProblems:
      service: checkout
      variant: "off"

# When the platform stops acting on its own and fetches a person. Every other
# safety mechanism here asks whether an action is allowed; this one asks whether
# the platform is still helping, which is the question a wrong model fails.
breaker:
  # A rate limit on autonomy. Five reversible actions in a quarter of an hour is
  # already more than anyone can read; past that it is a runaway whatever each
  # one claimed to be for.
  maximum_actions: 5
  window_seconds: 900.0

  # ...and a limit on futility. Three consecutive actions against one service
  # that each moved its signal by less than 0.5 points of availability means the
  # diagnosis is wrong, and more automation is the wrong answer to that.
  ineffective_streak: 3
  minimum_improvement: 0.005
