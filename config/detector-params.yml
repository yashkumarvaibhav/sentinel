    baseline_floor: 0.01
    trigger_relative_deformation: 0.3
    full_score_relative_deformation: 0.8
  interarrival_variation:
    baseline_floor: 0.1
    trigger_relative_deformation: 0.4
    full_score_relative_deformation: 0.8
