version: 1
feature_window_seconds: 60
watermark_lateness_seconds: 15
ewma_alpha: 0.15
baseline_warmup_points: 30
baseline_update_gate_ratio: 0.25
expected_band_relative_tolerance: 0.1
absolute_noise_floors:
  frontend.request_rate: 1.5
  checkout.error_ratio: 0.005
behavioral_ratios:
  ingress_windows:
    window_seconds: 60
    baseline_warmup_windows: 1
    minimum_window_requests: 6
    dedup_capacity: 10000
    service_mappings:
      frontend-proxy: frontend
  source_entropy:
    baseline_floor: 0.25
    trigger_relative_deformation: 0.3
    full_score_relative_deformation: 0.7
  auth_failure:
    baseline_floor: 0.01
    trigger_relative_deformation: 1.0
    full_score_relative_deformation: 5.0
  syn_ack:
    baseline_floor: 0.1
    trigger_relative_deformation: 0.5
    full_score_relative_deformation: 2.0
    ratio_ceiling: 20.0
  rpc_amplification:
    baseline_floor: 0.05
    trigger_relative_deformation: 1.0
    full_score_relative_deformation: 5.0
    ratio_ceiling: 20.0
  path_entropy:
    baseline_floor: 0.25
    trigger_relative_deformation: 0.3
    full_score_relative_deformation: 0.7
  conversion:
    baseline_floor: 0.01
    trigger_relative_deformation: 0.3
    full_score_relative_deformation: 0.8
  interarrival_variation:
    baseline_floor: 0.1
    trigger_relative_deformation: 0.4
    full_score_relative_deformation: 0.8
    minimum_points: 5
  crowd_coherence:
    baseline_floor: 0.1
    trigger_relative_deformation: 0.4
    full_score_relative_deformation: 0.8
    minimum_points: 5
log_templates:
  window_seconds: 60
  baseline_warmup_windows: 1
  minimum_window_records: 5
  dedup_capacity: 10000
  service_mappings:
    frontend-proxy: frontend
    checkout: checkout
    cart: cart
    payment: payment
  similarity_threshold: 0.4
  max_depth: 4
  max_children: 100
  max_clusters: 10000
  parameterize_numeric_tokens: true
  minimum_template_count: 5
  baseline_rate_floor: 0.01
  trigger_relative_deformation: 2.0
  full_score_relative_deformation: 10.0
change_point_saturation:
  resource_windows:
    advance_seconds: 10
    maximum_series_points: 24
    dedup_capacity: 10000
    namespace: otel-demo
    used_signal: container.memory.working_set
    capacity_signal: k8s.container.memory_limit
    unit: By
    rules:
      - service: cart
        container: cart
        detector_signal: container_memory
      - service: checkout
        container: checkout
        detector_signal: container_memory
      - service: frontend
        container: frontend
        detector_signal: container_memory
      - service: payment
        container: payment
        detector_signal: container_memory
      - service: email
        container: email
        detector_signal: container_memory
  pelt_model: l2
  pelt_penalty: 0.01
  minimum_series_points: 12
  minimum_segment_points: 4
  minimum_increasing_fraction: 0.8
  minimum_utilization_slope_per_second: 0.0002
  maximum_headroom_ratio: 0.2
  full_score_headroom_ratio: 0.05
liveness:
  window_seconds: 2
  dedup_capacity: 10000
  streams:
    - service: frontend
      signal: request_rate
  drop_rules:
    frontend.request_rate:
      minimum_expected_value: 1.5
      trigger_relative_drop: 0.5
      full_score_relative_drop: 0.9
  silence_rules:
    frontend.request_rate:
      maximum_age_seconds: 120.0
      full_score_age_seconds: 300.0
ingress_rate:
  # A live run has no capture manifest, so the telemetry service whose server
  # spans ARE the platform's request rate is stated here. Measured against the
  # running testbed: the demo's edge proxy reports itself as `frontend-proxy`
  # and is the only ingress in front of the `frontend` service.
  tick_seconds: 2
  unit: requests/s
  streams:
    - service: frontend
      signal: request_rate
      source_services:
        - frontend-proxy
edge_degradation:
  window_seconds: 12
  advance_seconds: 2
  baseline_warmup_samples: 3
  dedup_capacity: 10000
  rules:
    - caller: frontend
      downstream: checkout
      rpc_service: oteldemo.CheckoutService
      minimum_samples: 20
      latency_baseline_floor_ms: 5.0
      error_rate_baseline_floor: 0.01
      trigger_relative_latency_rise: 0.5
      full_score_relative_latency_rise: 2.0
      trigger_relative_error_rise: 1.0
      full_score_relative_error_rise: 5.0
    - caller: frontend
      downstream: cart
      rpc_service: oteldemo.CartService
      minimum_samples: 20
      latency_baseline_floor_ms: 5.0
      error_rate_baseline_floor: 0.01
      trigger_relative_latency_rise: 0.5
      full_score_relative_latency_rise: 2.0
      trigger_relative_error_rise: 1.0
      full_score_relative_error_rise: 5.0
    - caller: checkout
      downstream: cart
      rpc_service: oteldemo.CartService
      minimum_samples: 20
      latency_baseline_floor_ms: 5.0
      error_rate_baseline_floor: 0.01
      trigger_relative_latency_rise: 0.5
      full_score_relative_latency_rise: 2.0
      trigger_relative_error_rise: 1.0
      full_score_relative_error_rise: 5.0
    - caller: checkout
      downstream: payment
      rpc_service: oteldemo.PaymentService
      minimum_samples: 20
      latency_baseline_floor_ms: 5.0
      error_rate_baseline_floor: 0.01
      trigger_relative_latency_rise: 0.5
      full_score_relative_latency_rise: 2.0
      trigger_relative_error_rise: 1.0
      full_score_relative_error_rise: 5.0
episodes:
  # Anti-flapping lifecycle policy per symptom kind. open/close_after_ticks are
  # the breach/clear persistence counts; breach_score/clear_score are the
  # hysteresis deadband on the underlying symptom score. Starter values, tuned
  # only on disjoint development seeds; frozen/calibrated with 2.8 per-symptom
  # scoring.
  policies:
    RESIDUAL_EXCEED:
      open_after_ticks: 3
      close_after_ticks: 3
      breach_score: 0.5
      clear_score: 0.2
    RATIO_DEFORM:
      open_after_ticks: 3
      close_after_ticks: 3
      breach_score: 0.5
      clear_score: 0.2
    LOG_BURST:
      open_after_ticks: 3
      close_after_ticks: 3
      breach_score: 0.5
      clear_score: 0.2
    EDGE_DEGRADED:
      open_after_ticks: 3
      close_after_ticks: 3
      breach_score: 0.5
      clear_score: 0.2
    SATURATION:
      open_after_ticks: 2
      close_after_ticks: 4
      breach_score: 0.5
      clear_score: 0.2
    DROP:
      open_after_ticks: 3
      close_after_ticks: 3
      breach_score: 0.5
      clear_score: 0.2
    SILENCE:
      open_after_ticks: 2
      close_after_ticks: 2
      breach_score: 0.5
      clear_score: 0.2
