    trigger_relative_deformation: 1.0
    full_score_relative_deformation: 5.0
    ratio_ceiling: 20.0
  path_entropy:
    baseline_floor: 0.25
    trigger_relative_deformation: 0.3
    full_score_relative_deformation: 0.7
