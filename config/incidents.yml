# Incident clustering, lifecycle and severity.
#
# One fault lights many detectors. This file states when two durable episodes
# are evidence of the same real-world problem, how long an incident stays
# watched after its last symptom clears, and how a measured user-impact number
# becomes the severity a responder is paged on.
version: 1

clustering:
  # Two episodes co-occur if their windows overlap once each is widened by this
  # slack. Detectors confirm at different speeds - a saturation trend is slower
  # to open than a dependency edge - so strict overlap would split one storm.
  join_window_seconds: 120.0
  # Episodes on different services join only if those services are within this
  # many dependency hops. The service graph diameter is 2, so one hop keeps a
  # real propagation together while refusing to merge unrelated corners.
  max_topology_hops: 1

lifecycle:
  # After every member episode has closed, the incident is watched rather than
  # declared over: symptoms that come straight back belong to the same problem.
  resolve_after_seconds: 300.0

severity:
  # Read top down; the first band whose floor the measured impact clears wins.
  impact_bands:
    - severity: CRITICAL
      minimum_impact: 0.75
    - severity: HIGH
      minimum_impact: 0.50
    - severity: MEDIUM
      minimum_impact: 0.25
    - severity: LOW
      minimum_impact: 0.0
  # When the business-impact axis had no coverage there is no measured impact,
  # so severity falls back to the topology criticality of the worst-affected
  # service - deliberately one band below what the same criticality would earn
  # with evidence, because an unmeasured incident is not a proven emergency.
  criticality_fallback:
    critical: HIGH
    high: MEDIUM
    medium: LOW
    low: LOW

# Collapsing the storm to one origin.
#
# Three independent priors, weighted to sum to one:
#
#   onset       - the service that started first is the likelier cause. A prior,
#                 never a rule: detectors confirm at different speeds, so the
#                 origin's own log burst often lands after the edge symptom it
#                 caused one hop up.
#   reachability- a cause is downstream of its effects. The fraction of the
#                 other affected services that depend on this one, directly or
#                 transitively, over the committed dependency graph.
#   accusation  - a degraded `caller -> dependency.callee` edge is evidence FOR
#                 the callee and AGAINST the caller: the caller's trouble is
#                 already explained by the dependency it is waiting on.
causal:
  onset_weight: 0.30
  reachability_weight: 0.35
  accusation_weight: 0.35
  # If the top two candidates are this close, the storm does not point anywhere
  # clearly and no origin is named. An ambiguous answer is more useful than a
  # confident wrong one.
  minimum_margin: 0.05
  # Episode signals of this shape name the dependency they measure.
  dependency_signal_prefix: "dependency."

# Incident memory: "have we seen this shape before?"
#
# The signature is the four axis scores at the incident's peak, so a match means
# the same balance of hostility, degradation, self-inflicted change and user
# harm - not merely a similar-looking description.
memory:
  # How many precedents to surface. More than a handful is noise to a responder.
  neighbours: 5
  # Below this, two incidents are not the same shape and saying so would be
  # worse than saying nothing.
  minimum_similarity: 0.60
  # Recognition corroborates a verdict; it must never carry one. The whole nudge
  # is smaller than the smallest confidence gain the fusion rules can award.
  confidence_nudge: 0.05
  # Until the store holds this many incidents, the verifier's memory check has
  # nothing to check and passes vacuously (recorded as a bootstrap, never as a
  # confirmation) - otherwise nothing could ever be confirmed on an empty store.
  bootstrap_minimum_entries: 20

# The deterministic gate every hypothesis must survive before anything acts.
verification:
  # Detectors confirm at different speeds, so "the origin was observed first"
  # is checked with slack rather than to the second. The origin's first evidence
  # includes the dependency edges that accuse it - a caller noticing its callee
  # IS the first observation of the callee's fault.
  onset_tolerance_seconds: 30.0
