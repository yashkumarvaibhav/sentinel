version: 1
residual_precision_min: 0.90
residual_recall_min: 0.90
quiet_day_false_positive_rate_max: 0.0
telemetry_completeness_min: 0.95
# Anti-spam guard for the recall gate: every UNMATCHED predicted episode must be
# within this many dependency-graph hops of a concurrent labeled fault target,
# else it is a spurious false positive and fails the gate (unrelated budget 0).
# The service graph diameter is 2, so 1 meaningfully separates direct-neighbour
# propagation from unrelated services.
unmatched_episode_max_hops: 1
# Phase 2 gates on recall/coverage only (see evaluate_symptom_gates). These
# precision floors are RECORDED for transparency but NOT gated at Phase 2:
# a single injected fault produces a real topological storm of propagated and
# secondary episodes, so exact precision belongs to Phase 4 causal collapse.
# They are retained as the Phase-4 precision target.
symptom_precision_min:
  RESIDUAL_EXCEED: 0.90
  RATIO_DEFORM: 0.90
  LOG_BURST: 0.90
  EDGE_DEGRADED: 0.50
  SATURATION: 0.90
  DROP: 0.90
  SILENCE: 0.90
symptom_recall_min:
  RESIDUAL_EXCEED: 0.90
  RATIO_DEFORM: 0.90
  LOG_BURST: 0.90
  EDGE_DEGRADED: 0.90
  SATURATION: 0.90
  DROP: 0.90
  SILENCE: 0.90
