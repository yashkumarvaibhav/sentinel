version: 1
scenario_id: combo_night
description: A bounded attack, payment fault, resource leak, measured rate drop, and emitter silence run inside an explained match surge.
honesty: SIMULATED
telemetry:
  target: astronomy-shop/frontend-proxy
  source_service: frontend-proxy
  logical_service: frontend
  logical_signal: request_rate
  tick_seconds: 2
seeds:
  development: [503, 509]
  held_out: [9209, 9221]
load_phases:
  - name: warmup
    duration_seconds: 64
    rate_rps: 4
  - name: explained_event
    duration_seconds: 60
    rate_rps: 10
  - name: event_with_attack_and_fault
    duration_seconds: 180
    rate_rps: 10
  - name: event_with_resource_pressure
    duration_seconds: 180
    rate_rps: 10
  - name: event_with_measured_drop
    duration_seconds: 60
    rate_rps: 2
  - name: event_with_emitter_silence
    duration_seconds: 160
    rate_rps: 10
  - name: event_recovery
    duration_seconds: 60
    rate_rps: 10
contexts:
  - context_id: simulated_match
    name: Simulated championship match
    event_type: sports_fixture
    source: scenario_compiler
    honesty: SIMULATED
    start_offset_seconds: 64
    duration_seconds: 700
    expected_delta:
      frontend.request_rate: 2.5
    trust_score: 1.0
stimuli:
  - stimulus_id: payment_failure
    kind: flagd
    start_offset_seconds: 124
    duration_seconds: 180
    flag: paymentFailure
    variant: 100%
  - stimulus_id: behavior_attack
    kind: k6_path_attack
    start_offset_seconds: 124
    duration_seconds: 180
    attack: single_path
    path: /
    rate_rps: 20
  - stimulus_id: checkout_fault_traffic
    kind: k6_journey
    start_offset_seconds: 124
    duration_seconds: 180
    journey: checkout
    rate_rps: 2
  - stimulus_id: checkout_recovery_traffic
    kind: k6_journey
    start_offset_seconds: 304
    duration_seconds: 180
    journey: checkout
    rate_rps: 2
  - stimulus_id: email_memory_leak
    kind: flagd
    start_offset_seconds: 304
    duration_seconds: 180
    flag: emailMemoryLeak
    variant: 100x
  - stimulus_id: measured_rate_drop
    kind: k6_rate_phase
    start_offset_seconds: 484
    duration_seconds: 60
    rate_rps: 2
  - stimulus_id: frontend_emitter_silence
    kind: chaos_mesh
    start_offset_seconds: 544
    duration_seconds: 160
    experiment: frontend-proxy-pod-failure
residual_labels:
  - label_id: behavior-attack-volume
    stimulus_id: behavior_attack
    start_offset_seconds: 124
    end_offset_seconds: 304
symptom_labels:
  - label_id: behavior-attack-path-entropy
    kind: RATIO_DEFORM
    service: frontend
    signal: path_entropy
    stimulus_id: behavior_attack
    start_offset_seconds: 124
    end_offset_seconds: 304
  - label_id: payment-failure-log-burst
    kind: LOG_BURST
    service: payment
    signal: log_template_rate
    stimulus_id: payment_failure
    start_offset_seconds: 124
    end_offset_seconds: 304
  - label_id: checkout-payment-failure
    kind: EDGE_DEGRADED
    service: checkout
    signal: dependency.payment
    stimulus_id: payment_failure
    start_offset_seconds: 124
    end_offset_seconds: 304
  - label_id: email-memory-saturation
    kind: SATURATION
    service: email
    signal: container_memory
    stimulus_id: email_memory_leak
    start_offset_seconds: 304
    end_offset_seconds: 484
  - label_id: frontend-measured-rate-drop
    kind: DROP
    service: frontend
    signal: request_rate
    stimulus_id: measured_rate_drop
    start_offset_seconds: 484
    end_offset_seconds: 544
  - label_id: frontend-emitter-silence
    kind: SILENCE
    service: frontend
    signal: request_rate
    stimulus_id: frontend_emitter_silence
    start_offset_seconds: 544
    end_offset_seconds: 704
