version: 1
scenario_id: match_night
description: A legitimate 2.5x match surge followed by unexplained load inside the event.
honesty: SIMULATED
telemetry:
  target: astronomy-shop/frontend-proxy
  source_service: frontend-proxy
  logical_service: frontend
  logical_signal: request_rate
  tick_seconds: 2
seeds:
  development: [211, 223]
  held_out: [8923, 8941]
load_phases:
  - name: warmup
    duration_seconds: 64
    rate_rps: 4
  - name: explained_event
    duration_seconds: 20
    rate_rps: 10
  - name: unexplained_offset
    duration_seconds: 16
    rate_rps: 16
contexts:
  - context_id: simulated_match
    name: Simulated championship match
    event_type: sports_fixture
    source: scenario_compiler
    honesty: SIMULATED
    start_offset_seconds: 64
    duration_seconds: 36
    expected_delta:
      frontend.request_rate: 2.5
    trust_score: 1.0
residual_labels:
  - label_id: offset_core
    start_offset_seconds: 84
    end_offset_seconds: 100
# What the decision plane ought to conclude. The unexplained offset is real
# volume the calendar does not account for, and it deforms no behavioural ratio
# and degrades no service - so there is nothing here that can honestly be named
# an attack or a fault. UNEXPLAINED is the correct answer, not a lesser one: it
# must be surfaced (never suppressed as "the expected event", because the event
# demonstrably does not explain it) and it must never be acted on.
decision_labels:
  - label_id: unexplained-offset-decision
    expectation: UNEXPLAINED
    label_refs: [offset_core]
