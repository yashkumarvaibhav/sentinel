# OpenTelemetry Demo (Astronomy Shop) — the instrumented mesh we score against.
#
# Two edits matter, and both follow from the same idea: the demo supplies the
# *application*, we supply the *observability*. Its bundled backends are turned
# off, and its collector forwards everything to ours instead.

# --- the demo's own observability stack, all off -----------------------------
# We are the observability stack. Running theirs too would double the memory
# footprint on a shared box and split the telemetry across two sets of stores.
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

components:
  # A local model server is out of scope for this project and would be the
  # single heaviest pod in the mesh. product-reviews depends on it.
  llm:
    enabled: false
  product-reviews:
    enabled: false

  # Scenario traffic comes from short-lived, resource-capped k6 Jobs. The
  # chart's always-on Locust component duplicates that load, consumes a 1.5Gi
  # request, and makes capture volume depend on an uncontrolled workload.
  load-generator:
    enabled: false

  # The chart's 20Mi default repeatedly OOM-kills this instrumented Go service
  # before a scoring workload can read products. Keep it tightly bounded above
  # its measured footprint and inside the agent node's existing 8GiB cap.
  product-catalog:
    resources:
      limits:
        memory: 64Mi

  # The chart's 20Mi default OOM-killed checkout repeatedly under the bounded
  # 2 rps support journey, starving downstream email work and corrupting the
  # dependency baseline. Preserve a hard cap while allowing its measured
  # instrumented working set to survive the scoring workload.
  checkout:
    resources:
      limits:
        memory: 64Mi

  # Envoy sits at roughly 62Mi immediately after startup, leaving less than
  # 3Mi under the chart's 65Mi cap. A contained 16 rps scoring burst proved
  # that margin insufficient by OOM-killing the proxy. Keep the chart's 65Mi
  # request, but give valid evaluation traffic a still-hard 128Mi ceiling.
  frontend-proxy:
    resources:
      limits:
        memory: 128Mi
    # The edge is the only place a surgical remediation can happen: rate-limiting
    # one cohort is the rung it is safe to fire *during* a legitimate surge,
    # because it restrains the deforming behaviour and not the service everyone
    # else is using. The stock proxy has no such surface — its admin listener
    # has no admin runtime layer, so `/runtime_modify` is refused, and there is
    # no rate-limit filter to control. lab/testbed/envoy.tmpl.yaml adds both,
    # shipped inert; lab-deploy.sh publishes it as this ConfigMap and stamps the
    # pod with its checksum so a changed template actually rolls the proxy.
    mountedConfigMaps:
      - name: sentinel-edge
        existingConfigMap: sentinel-edge-envoy
        mountPath: /home/envoy/envoy.tmpl.yaml
        subPath: envoy.tmpl.yaml

  flagd:
    # flagd itself is essential — it is how faults get injected and what the
    # flag actuator will drive. Its browser UI is not: it OOMs at the chart's
    # 250Mi limit, and we drive flags through the API, not a second web app.
    sidecarContainers: []

# --- the demo's in-cluster collector ----------------------------------------
opentelemetry-collector:
  # This collector is intentionally per-node: kubelet usage and the Kubernetes
  # hard-limit gauge must describe the same container instance. The chart's
  # cluster-metrics preset adds leader election, which made the emitted limit
  # set depend on whether the server or application node won after a restart.
  # A null receiver link disables that election while retaining the preset's
  # RBAC; semantic duplicate limits from two nodes collapse in our runner.
  mode: daemonset
  # k3d reports each node's Docker-network IP as InternalIP, but kubelet's
  # 10250 listener is inside the node container's network namespace. A normal
  # pod repeatedly gets connection refused at that address. Host networking
  # here means the contained k3d node, never the shared physical host; it lets
  # each DaemonSet collector reach only its own kubelet on loopback.
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  presets:
    # Host metrics read the *host's* /proc through the node container, which on
    # a shared machine describes other people's workloads, not the testbed.
    hostMetrics:
      enabled: false
    kubernetesAttributes:
      enabled: true
    kubeletMetrics:
      enabled: true
    clusterMetrics:
      enabled: true
  config:
    receivers:
      k8s_cluster:
        collection_interval: 10s
        k8s_leader_elector: null
      kubeletstats:
        endpoint: 127.0.0.1:10250
        # A 144-second scenario must contain at least the detector's twelve
        # real points after startup jitter; the chart default is 20 seconds.
        collection_interval: 10s
    exporters:
      # Removed: they point at the backends we just disabled. Left defined,
      # their configs fail validation.
      otlp/jaeger: null
      otlphttp/prometheus: null
      opensearch: null
      # Everything goes to our gateway collector, reachable by container name
      # because the cluster shares the stack's docker network.
      otlp/sentinel:
        endpoint: sentinel-otel-collector-1:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 2000
    service:
      pipelines:
        traces:
          # spanmetrics stays: it is a connector, not a backend — it feeds the
          # metrics pipeline, and dropping it from here leaves that pipeline
          # with a receiver nothing produces into, which fails config build.
          exporters: [otlp/sentinel, spanmetrics]
        metrics:
          exporters: [otlp/sentinel]
        logs:
          exporters: [otlp/sentinel]
