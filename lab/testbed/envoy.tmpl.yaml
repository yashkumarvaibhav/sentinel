#
# VENDORED from opentelemetry-demo `src/frontend-proxy/envoy.tmpl.yaml` at tag
# 2.2.0, which is the appVersion of the chart lab-deploy.sh pins.
#   vendored-from-chart: 0.40.10
# A test asserts that marker against lab-deploy.sh's CHART_VERSION, so bumping
# the chart cannot silently leave this file describing an older demo.
#
# WHY WE VENDOR IT AT ALL. The stock template gives Envoy an admin listener but
# only a `static_layer_0`, and `/runtime_modify` is refused without an admin
# layer - so there is no runtime control surface at the edge, and no rate-limit
# filter to control. An action plane that can only scale pods can answer a fault
# but not an attack: the surgical rung, the one it is safe to fire *during* a
# legitimate surge because it restricts a cohort rather than a service, has
# nothing to act on. This file adds that surface.
#
# THREE ADDITIONS, and nothing else is changed:
#
#   1. `envoy.filters.http.local_ratelimit` in the filter chain, configured at
#      the listener with a stat prefix and NO token bucket, which makes it a
#      no-op for every route that does not opt in.
#   2. Two cohort routes above the catch-all, each carrying its own token bucket
#      and its own runtime keys. They route to the same cluster the catch-all
#      does, so while the keys sit at 0 they change no behaviour and no
#      telemetry - which is what lets this land on the graded testbed.
#   3. A `sentinel` static runtime layer that publishes those keys at 0, and an
#      `admin_layer` after it so `/runtime_modify` can raise them. The static
#      layer exists so the keys are readable from `/runtime` before anyone has
#      ever written one: an actuator that cannot read the current value cannot
#      record what to revert to.
#
# TWO RUNGS, TWO MECHANISMS, and the difference is the point. `sentinel.ratelimit`
# drives the local rate-limit filter: traffic above the cohort's configured
# ceiling is REFUSED with a 429. `sentinel.throttle` drives the fault filter's
# delay, which the demo already runs, through its `delay_percent_runtime` key: a
# share of the cohort is SLOWED and nobody is turned away. Two dials on one
# filter would have been one rung wearing two names; slowing a cohort you are
# not yet sure about, rather than refusing it, is a different decision and
# deserves a different mechanism.
#
# The per-route fault config replaces the listener's for these routes, so the
# demo's header-driven delay (`imageSlowLoad` and friends) does not apply to
# them. That costs nothing today: `/api/checkout` is not one of its targets, and
# the other cohort route only matches traffic we have tagged ourselves.
#
# SHIPPED INERT. Every percentage defaults to 0 in both the filter config and
# the static layer, so deploying this changes nothing until the action plane
# deliberately raises a key. A rate limit that arrives switched on is an outage.
static_resources:
  listeners:
    - address:
        socket_address:
          address: "${ENVOY_ADDR}"
          port_value: ${ENVOY_PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                tracing:
                  spawn_upstream_span: true
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: opentelemetry_collector_grpc
                        timeout: 0.250s
                      service_name: ${OTEL_SERVICE_NAME}
                      resource_detectors:
                        - name: envoy.tracers.opentelemetry.resource_detectors.environment
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.tracers.opentelemetry.resource_detectors.v3.EnvironmentResourceDetectorConfig
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: frontend
                      domains:
                        - "*"
                      routes:
                        - match: { path: "/loadgen" }
                          redirect: { path_redirect: "/loadgen/" }
                        - match: { prefix: "/loadgen/" }
                          route: { cluster: loadgen, prefix_rewrite: "/" }
                        - match: { prefix: "/otlp-http/" }
                          route: { cluster: opentelemetry_collector_http, prefix_rewrite: "/" }
                        - match: { path: "/jaeger" }
                          redirect: { path_redirect: "/jaeger/" }
                        - match: { prefix: "/jaeger/" }
                          route: { cluster: jaeger }
                        - match: { path: "/grafana" }
                          redirect: { path_redirect: "/grafana/" }
                        - match: { prefix: "/grafana/" }
                          route: { cluster: grafana }
                        - match: { prefix: "/images/" }
                          route: { cluster: image-provider, prefix_rewrite: "/" }
                        - match: { prefix: "/flagservice/" }
                          route: { cluster: flagservice, prefix_rewrite: "/", timeout: 0s }
                        - match: { prefix: "/feature" }
                          route:
                            cluster: flagd-ui
                            prefix_rewrite: "/"
                            upgrade_configs:
                              - upgrade_type: websocket
                        # --- SENTINEL cohort routes (addition 2) -------------
                        # One route per cohort in config/cohorts.yml, each an
                        # exact restatement of that cohort's `match` in the
                        # vocabulary the edge can actually enforce. They route
                        # to the same cluster as the catch-all below, so while
                        # the runtime keys sit at 0 these are behaviourally and
                        # observably identical to not being here.
                        #
                        # The token buckets are the OPERATOR's number: how much
                        # this cohort is allowed when it is being restrained.
                        # The action plane never sets a rate - it decides
                        # whether, and how hard, the configured limit applies.
                        # That split is deliberate: a capacity is a standing
                        # decision about the service, and an autonomous system
                        # that could also pick the number could rate-limit a
                        # cohort to nothing by getting one field wrong.
                        # cohort: checkout-users (match http.route /api/checkout)
                        - match: { prefix: "/api/checkout" }
                          route: { cluster: frontend }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: sentinel_checkout_users
                              token_bucket:
                                max_tokens: 5
                                tokens_per_fill: 5
                                fill_interval: 1s
                              filter_enabled:
                                runtime_key: sentinel.ratelimit.checkout_users.enabled
                                default_value: { numerator: 0, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: sentinel.ratelimit.checkout_users.enforced
                                default_value: { numerator: 0, denominator: HUNDRED }
                            envoy.filters.http.fault:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                              max_active_faults: 100
                              delay:
                                fixed_delay: 0.25s
                                percentage: { numerator: 0, denominator: HUNDRED }
                              delay_percent_runtime: sentinel.throttle.checkout_users.percent
                        # cohort: general-traffic (match sentinel.cohort=general).
                        # The header is how a cohort becomes addressable at the
                        # edge at all - docs/testbed.md records that the demo
                        # emits no cohort dimension of its own. Keep this route
                        # LAST before the catch-all: it matches every path, so a
                        # tagged request to a service prefix above would reach
                        # the frontend instead. Only traffic we tag ourselves
                        # carries the header, so nothing in the demo is affected.
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-sentinel-cohort
                                string_match: { exact: general }
                          route: { cluster: frontend }
                          typed_per_filter_config:
                            envoy.filters.http.local_ratelimit:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                              stat_prefix: sentinel_general_traffic
                              token_bucket:
                                max_tokens: 50
                                tokens_per_fill: 50
                                fill_interval: 1s
                              filter_enabled:
                                runtime_key: sentinel.ratelimit.general_traffic.enabled
                                default_value: { numerator: 0, denominator: HUNDRED }
                              filter_enforced:
                                runtime_key: sentinel.ratelimit.general_traffic.enforced
                                default_value: { numerator: 0, denominator: HUNDRED }
                            envoy.filters.http.fault:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                              max_active_faults: 100
                              delay:
                                fixed_delay: 0.25s
                                percentage: { numerator: 0, denominator: HUNDRED }
                              delay_percent_runtime: sentinel.throttle.general_traffic.percent
                        # --- end SENTINEL cohort routes ----------------------
                        - match: { prefix: "/" }  # Default/catch-all route - keep last since prefix:"/" matches everything
                          route: { cluster: frontend }
                http_filters:
                  # --- SENTINEL edge rate limiting (addition 1) --------------
                  # Declared with no token bucket on purpose. At the listener
                  # this filter therefore limits nothing at all; only the routes
                  # that supply their own bucket above are ever restricted, so
                  # the blast radius of this filter is exactly the cohorts an
                  # operator has written down.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: sentinel_edge
                  # --- end SENTINEL edge rate limiting -----------------------
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      max_active_faults: 100
                      delay:
                        header_delay: {}
                        percentage:
                          numerator: 100
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.open_telemetry
                    typed_config:
                      "@type": "type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig"
                      common_config:
                        log_name: "otel_envoy_access_log"
                        grpc_service:
                          envoy_grpc:
                            cluster_name: opentelemetry_collector_grpc
                        transport_api_version: "V3"
                      body:
                        # yamllint disable-line rule:line-length
                        string_value: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% %CONNECTION_TERMINATION_DETAILS% \"%UPSTREAM_TRANSPORT_FAILURE_REASON%\" %BYTES_RECEIVED% %BYTES_SENT% %DURATION% %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% \"%REQ(X-FORWARDED-FOR)%\" \"%REQ(USER-AGENT)%\" \"%REQ(X-REQUEST-ID)%\" \"%REQ(:AUTHORITY)%\" \"%UPSTREAM_HOST%\" %UPSTREAM_CLUSTER% %UPSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_REMOTE_ADDRESS% %REQUESTED_SERVER_NAME% %ROUTE_NAME%\n"
                      resource_attributes:
                        values:
                          - key: "service.name"
                            value:
                              string_value: ${OTEL_SERVICE_NAME}
                      attributes:
                        values:
                          - key: "destination.address"
                            value:
                              string_value: "%UPSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          - key: "event.name"
                            value:
                              string_value: "proxy.access"
                          - key: "server.address"
                            value:
                              string_value: "%DOWNSTREAM_LOCAL_ADDRESS%"
                          - key: "source.address"
                            value:
                              string_value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          - key: "upstream.cluster"
                            value:
                              string_value: "%UPSTREAM_CLUSTER%"
                          - key: "upstream.host"
                            value:
                              string_value: "%UPSTREAM_HOST%"
                          - key: "user_agent.original"
                            value:
                              string_value: "%REQ(USER-AGENT)%"
                          - key: "url.full"
                            value:
                              string_value: "%REQ(:SCHEME)%://%REQ(:AUTHORITY)%%REQ(:PATH)%"
                          - key: "url.path"
                            value:
                              string_value: "%REQ(:PATH)%"
                          - key: "url.query"
                            value:
                              string_value: "%REQ(:QUERY)%"
                          - key: "url.template"
                            value:
                              string_value: "%ROUTE_NAME%"
  clusters:
    - name: opentelemetry_collector_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opentelemetry_collector_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OTEL_COLLECTOR_HOST}
                      port_value: ${OTEL_COLLECTOR_PORT_GRPC}
    - name: opentelemetry_collector_http
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: opentelemetry_collector_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OTEL_COLLECTOR_HOST}
                      port_value: ${OTEL_COLLECTOR_PORT_HTTP}
    - name: frontend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FRONTEND_HOST}
                      port_value: ${FRONTEND_PORT}
    - name: image-provider
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: image-provider
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${IMAGE_PROVIDER_HOST}
                      port_value: ${IMAGE_PROVIDER_PORT}
    - name: flagservice
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: flagservice
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FLAGD_HOST}
                      port_value: ${FLAGD_PORT}
    - name: flagd-ui
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: flagd-ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FLAGD_UI_HOST}
                      port_value: ${FLAGD_UI_PORT}
    - name: loadgen
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: loadgen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${LOCUST_WEB_HOST}
                      port_value: ${LOCUST_WEB_PORT}
    - name: grafana
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: grafana
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${GRAFANA_HOST}
                      port_value: ${GRAFANA_PORT}
    - name: jaeger
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: jaeger
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${JAEGER_HOST}
                      port_value: ${JAEGER_UI_PORT}
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: ${ENVOY_ADMIN_PORT}
layered_runtime:
  layers:
    - name: static_layer_0
      static_layer:
        envoy:
          resource_limits:
            listener:
              example_listener_name:
                connection_limit: 10000
    # --- SENTINEL runtime control surface (addition 3) ----------------------
    # Publish every cohort key at zero. Envoy would fall back to each filter's
    # own default without this, but the key would not appear in `/runtime`, and
    # an actuator that cannot read the value it is about to overwrite has no
    # honest revert token to record. Stating them here means the current
    # restraint on every cohort is always readable, including "none".
    - name: sentinel_static
      static_layer:
        sentinel:
          ratelimit:
            checkout_users:
              enabled: 0
              enforced: 0
            general_traffic:
              enabled: 0
              enforced: 0
          throttle:
            checkout_users:
              percent: 0
            general_traffic:
              percent: 0
    # Last, so it wins: this is the layer `POST /runtime_modify` writes into,
    # and without it the admin endpoint refuses the request outright.
    - name: admin_layer
      admin_layer: {}
    # --- end SENTINEL runtime control surface -------------------------------
