# Telemetry front door: everything instrumented speaks OTLP to this collector,
# which fans out to the three stores. Publishing raw OTLP onto the bus — the
# boundary that capture replay records — is wired up with the ingest topology.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # A collector that OOMs takes the whole telemetry path down with it, so it
  # sheds load before it hits the container limit.
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
    spike_limit_mib: 96
  resourcedetection:
    detectors: [env, system]
    timeout: 2s

exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo]
