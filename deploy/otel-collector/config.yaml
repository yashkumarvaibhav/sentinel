# Telemetry front door: everything instrumented speaks OTLP to this collector,
# which fans out to the three stores. Publishing raw OTLP onto the bus — the
# boundary that capture replay records — is wired up with the ingest topology.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    # Raw OTLP is one Kafka record per batch. Bound both the trigger and hard
    # item ceiling so normal mesh bursts stay below Redpanda's 1 MiB limit.
    send_batch_size: 256
    send_batch_max_size: 256
  # A collector that OOMs takes the whole telemetry path down with it, so it
  # sheds load before it hits the container limit.
  memory_limiter:
    check_interval: 2s
    limit_mib: 384
    spike_limit_mib: 96
  resource_detection:
    detectors: [env, system]
    timeout: 2s

exporters:
  prometheus_remote_write:
    endpoint: http://victoriametrics:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  kafka/raw:
    brokers: [redpanda:9092]
    client_id: sentinel-otel-collector
    metrics:
      topic: otlp.raw.metrics
      encoding: otlp_json
    logs:
      topic: otlp.raw.logs
      encoding: otlp_json
    traces:
      topic: otlp.raw.traces
      encoding: otlp_json
    producer:
      compression: zstd
      required_acks: 1
      allow_auto_topic_creation: true
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [prometheus_remote_write, kafka/raw]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_http/loki, kafka/raw]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc/tempo, kafka/raw]
