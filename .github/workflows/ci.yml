name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run tells you nothing useful — cancel it and grade the new head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Format
        run: uv run ruff format --check . ../lab

      - name: Lint
        run: uv run ruff check . ../lab

      - name: Types
        run: uv run mypy . ../lab

      - name: Tests
        run: uv run pytest

  web:
    name: web — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  score-golden:
    name: scoring — held-out captures and goldens
    runs-on: ubuntu-latest
    needs: [python]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock

      - name: Install
        working-directory: platform
        run: uv sync --all-extras --frozen

      - name: Held-out score
        run: make score

      - name: Golden replay
        run: make golden

      - name: Reports are current
        run: git diff --exit-code -- docs/reports/phase-1-decomposition-score.md lab/goldens

  stack:
    name: stack — compose smoke
    runs-on: ubuntu-latest
    needs: [python, web]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Bring the stack up
        run: make up

      - name: The gateway reports every plane ready
        run: |
          set -euo pipefail
          # Through the front door, exactly as a browser would reach it.
          status=$(curl -sf http://127.0.0.1:8041/api/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          test "$status" = "ready"

      - name: Migrations and repository round trips
        run: |
          make migrate
          make verify-storage

      - name: The build stamp names this commit
        run: |
          set -euo pipefail
          # Compared against the checked-out HEAD, which on a pull request is
          # the merge commit the images were actually built from.
          served=$(curl -sf http://127.0.0.1:8041/api/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_sha"])')
          test "$served" = "$(git rev-parse HEAD)"

      - name: The front door serves the app
        run: curl -sf -o /dev/null http://127.0.0.1:8041/

      # The one gate that drives the shipped bundle through a real browser
      # against a real gateway. Everything above it mocks at least one of those
      # seams, so their agreement has never been checked by anything but a
      # person looking at it.
      #
      # It runs here rather than in the `web` job for the same reason: there is
      # no stack there to point at, and a suite that started its own backend
      # would be testing a different system from the one that ships.
      - name: Install the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: The north-star flow, through a real browser
        working-directory: web
        env:
          SENTINEL_E2E_BASE_URL: http://127.0.0.1:8041
        run: npx playwright test

      - name: Keep the browser trace of a failed flow
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

      - name: Diagnostics on failure
        if: failure()
        run: |
          make ps || true
          docker compose --project-name sentinel --project-directory . \
            -f deploy/docker-compose.yml logs --tail=80 || true

      - name: Tear down
        if: always()
        run: make nuke
