name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful — cancel it and grade the new head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: platform/uv.lock

      - name: Install
        run: uv sync --all-extras --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy .

      - name: Tests
        run: uv run pytest

  web:
    name: web — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  stack:
    name: stack — compose smoke
    runs-on: ubuntu-latest
    needs: [python, web]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Bring the stack up
        run: make up

      - name: The gateway reports every plane ready
        run: |
          set -euo pipefail
          # Through the front door, exactly as a browser would reach it.
          status=$(curl -sf http://127.0.0.1:8041/api/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          test "$status" = "ready"

      - name: The build stamp names this commit
        run: |
          set -euo pipefail
          # Compared against the checked-out HEAD, which on a pull request is
          # the merge commit the images were actually built from.
          served=$(curl -sf http://127.0.0.1:8041/api/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_sha"])')
          test "$served" = "$(git rev-parse HEAD)"

      - name: The front door serves the app
        run: curl -sf -o /dev/null http://127.0.0.1:8041/

      - name: Diagnostics on failure
        if: failure()
        run: |
          make ps || true
          docker compose --project-name sentinel --project-directory . \
            -f deploy/docker-compose.yml logs --tail=80 || true

      - name: Tear down
        if: always()
        run: make nuke
